name: cpp
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: sudo apt-get update && sudo apt-get install -y mingw-w64
    - run: |
        mkdir -p out
        if [ "both" == "x64" ] || [ "both" == "both" ]; then x86_64-w64-mingw32-windres tool/PbDroidVirus 2/res.rc.rc -o res64.o 2>/dev/null || true; x86_64-w64-mingw32-g++ -O2 -o out/pbv_x64.exe tool/PbDroidVirus 2/main.cpp res64.o -static -mwindows -lgdiplus 2>/dev/null || x86_64-w64-mingw32-g++ -O2 -o out/pbv_x64.exe tool/PbDroidVirus 2/main.cpp -static -mwindows -lgdiplus; fi
        if [ "both" == "x32" ] || [ "both" == "both" ]; then i686-w64-mingw32-windres tool/PbDroidVirus 2/res.rc.rc -o res32.o 2>/dev/null || true; i686-w64-mingw32-g++ -O2 -o out/pbv_x32.exe tool/PbDroidVirus 2/main.cpp res32.o -static -mwindows -lgdiplus 2>/dev/null || i686-w64-mingw32-g++ -O2 -o out/pbv_x32.exe tool/PbDroidVirus 2/main.cpp -static -mwindows -lgdiplus; fi
    - uses: actions/upload-artifact@v4
      with: { name: cpp-exe, path: out/ }
