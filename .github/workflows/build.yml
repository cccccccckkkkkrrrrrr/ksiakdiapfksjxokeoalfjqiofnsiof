name: cpp
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: sudo apt-get update && sudo apt-get install -y mingw-w64
    - run: |
        mkdir -p out
        if [ "x64" == "x64" ] || [ "x64" == "both" ]; then x86_64-w64-mingw32-g++ -O2 -o out/salinewinpayload6_x64.exe tool/main.cpp res64.o -static -mwindows 2>/dev/null || x86_64-w64-mingw32-g++ -O2 -o out/salinewinpayload6_x64.exe tool/main.cpp -static -mwindows; fi
        if [ "x64" == "x32" ] || [ "x64" == "both" ]; then i686-w64-mingw32-g++ -O2 -o out/salinewinpayload6_x32.exe tool/main.cpp res32.o -static -mwindows 2>/dev/null || i686-w64-mingw32-g++ -O2 -o out/salinewinpayload6_x32.exe tool/main.cpp -static -mwindows; fi
    - uses: actions/upload-artifact@v4
      with: { name: cpp-exe, path: out/ }
