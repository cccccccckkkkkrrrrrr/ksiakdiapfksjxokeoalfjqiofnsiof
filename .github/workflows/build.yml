name: asm
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: sudo apt-get update && sudo apt-get install -y nasm mingw-w64
    - run: |
        mkdir -p out
        if [ "x64" == "x64" ] || [ "x64" == "both" ]; then nasm -f win64 tool/main.asm -o main64.obj; x86_64-w64-mingw32-gcc -o out/assemv_x64.exe main64.obj -mwindows; fi
        if [ "x64" == "x32" ] || [ "x64" == "both" ]; then nasm -f win32 tool/main.asm -o main32.obj; i686-w64-mingw32-gcc -o out/assemv_x32.exe main32.obj -mwindows; fi
    - uses: actions/upload-artifact@v4
      with: { name: asm-exe, path: out/ }
