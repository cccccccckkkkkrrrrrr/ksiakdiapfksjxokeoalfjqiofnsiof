name: cpp
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: sudo apt-get update && sudo apt-get install -y mingw-w64
    - run: |
        mkdir -p out
        if [ "both" == "x64" ] || [ "both" == "both" ]; then x86_64-w64-mingw32-g++ -O2 -o out/zaebal_x64.exe tool/main.cpp -static; fi
        if [ "both" == "x32" ] || [ "both" == "both" ]; then i686-w64-mingw32-g++ -O2 -o out/zaebal_x32.exe tool/main.cpp -static; fi
    - uses: actions/upload-artifact@v4
      with: { name: cpp-exe, path: out/ }
