name: Build MainHub Native Library (mips only)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up Android NDK (r21e)
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r21e

    - name: Compile C Code for mips and mips64
      run: |
        NDK_BIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
        mkdir -p "libs/Маинхаб/mips" "libs/Маинхаб/mips64"
        
        # mips
        $NDK_BIN/mipsel-linux-android16-clang -shared -fPIC mainhub.c -o "libs/Маинхаб/mips/libmainhub.so" -llog || true
        
        # mips64
        $NDK_BIN/mips64el-linux-android21-clang -shared -fPIC mainhub.c -o "libs/Маинхаб/mips64/libmainhub.so" -llog || true

    - name: Commit and Push Native Libraries
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add -f "libs/Маинхаб"
        git commit -m "Build MainHub native library for mips and mips64" || echo "No changes to commit"
        git pull --rebase origin main
        git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
