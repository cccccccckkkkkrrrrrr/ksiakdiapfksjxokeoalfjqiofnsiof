name: Build MainHub Native Libraries

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c
    - name: Compile C Code
      run: |
        NDK_BIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
        mkdir -p "libs/Маинхаб/armeabi-v7a" "libs/Маинхаб/arm64-v8a" "libs/Маинхаб/x86" "libs/Маинхаб/x86_64"
        
        # armeabi-v7a
        $NDK_BIN/armv7a-linux-androideabi21-clang -shared -fPIC mainhub.c -o "libs/Маинхаб/armeabi-v7a/libmainhub.so" -llog
        
        # arm64-v8a
        $NDK_BIN/aarch64-linux-android21-clang -shared -fPIC mainhub.c -o "libs/Маинхаб/arm64-v8a/libmainhub.so" -llog
        
        # x86 (32-bit)
        $NDK_BIN/i686-linux-android21-clang -shared -fPIC mainhub.c -o "libs/Маинхаб/x86/libmainhub.so" -llog
        
        # x86_64
        $NDK_BIN/x86_64-linux-android21-clang -shared -fPIC mainhub.c -o "libs/Маинхаб/x86_64/libmainhub.so" -llog
    - name: Commit and Push
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add -f "libs/Маинхаб"
        git commit -m "Build MainHub native libraries"
        git pull --rebase origin main
        git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
