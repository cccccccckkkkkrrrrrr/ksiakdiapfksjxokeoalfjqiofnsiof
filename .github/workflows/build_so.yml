name: Build MainHub Native Library (armeabi only)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c
    - name: Compile C Code for armeabi
      run: |
        NDK_BIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
        mkdir -p "libs/Маинхаб/armeabi"
        
        # Сборка только под armeabi (через armv7a с флагом armv5te)
        $NDK_BIN/armv7a-linux-androideabi21-clang -shared -fPIC -march=armv5te -mfloat-abi=soft mainhub.c -o "libs/Маинхаб/armeabi/libmainhub.so" -llog
    - name: Commit and Push
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add -f "libs/Маинхаб/armeabi"
        git commit -m "Build MainHub native library for armeabi only" || echo "No changes to commit"
        git pull --rebase origin main
        git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
