name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - msystem: MINGW64
            arch: x86_64
            exe_name: "My Horror Android 5 Windows Remake x64.exe"
          - msystem: MINGW32
            arch: i686
            exe_name: "My Horror Android 5 Windows Remake x32.exe"
    steps:
    - uses: actions/checkout@v4

    - name: Setup MSYS2 (${{ matrix.msystem }})
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.msystem }}
        update: true
        install: mingw-w64-${{ matrix.arch }}-gcc

    - name: Compile ${{ matrix.arch }} EXE
      shell: msys2 {0}
      run: |
        g++ -c mainhub_win.cpp -o mainhub_${{ matrix.arch }}.o
        windres resource.rc -O coff -o resource_${{ matrix.arch }}.res
        g++ mainhub_${{ matrix.arch }}.o resource_${{ matrix.arch }}.res -o "${{ matrix.exe_name }}" -lgdiplus -lwinmm -lcomctl32 -lshlwapi -mwindows -static-libgcc -static-libstdc++

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.arch }}-exe
        path: "${{ matrix.exe_name }}"
