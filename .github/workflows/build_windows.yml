name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - msystem: MINGW64
            arch: x86_64
            exe_name: "soaidiai.exe"
          - msystem: MINGW32
            arch: i686
            exe_name: "soaidiai_x32.exe"
    steps:
    - uses: actions/checkout@v4

    - name: Setup MSYS2 (${{ matrix.msystem }})
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.msystem }}
        update: true
        install: mingw-w64-${{ matrix.arch }}-gcc

    - name: Compile ${{ matrix.arch }} EXE
      shell: msys2 {0}
      run: |
        g++ mainhub_win.cpp -o "${{ matrix.exe_name }}" -lgdiplus -lwinmm -lcomctl32 -lshlwapi -mwindows -static-libgcc -static-libstdc++

    - name: Commit and Push EXE
      if: matrix.arch == 'x86_64'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add "${{ matrix.exe_name }}"
        git commit -m "Auto-build working soaidiai.exe from hex" || echo "No changes"
        git pull --rebase origin main
        git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
