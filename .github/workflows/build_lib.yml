name: build-lib
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" > /dev/null
    - run: |
        B=$ANDROID_HOME/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin
        mkdir -p out/arm64-v8a out/armeabi-v7a out/x86 out/x86_64
        $B/aarch64-linux-android21-clang -shared -fPIC -O2 -o out/arm64-v8a/liblibrary.so lmfao.c
        $B/armv7a-linux-androideabi21-clang -shared -fPIC -O2 -o out/armeabi-v7a/liblibrary.so lmfao.c
        $B/i686-linux-android21-clang -shared -fPIC -O2 -o out/x86/liblibrary.so lmfao.c
        $B/x86_64-linux-android21-clang -shared -fPIC -O2 -o out/x86_64/liblibrary.so lmfao.c
    - uses: actions/upload-artifact@v4
      with: { name: driver-libs, path: out/ }
