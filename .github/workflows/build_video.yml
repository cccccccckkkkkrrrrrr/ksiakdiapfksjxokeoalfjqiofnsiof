name: build-video-libs
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" > /dev/null
        echo "NDK=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
    - name: Build
      run: |
        B=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
        mkdir -p out/armeabi-v7a
        # Флаг -march=armv5te заставляет компилятор делать код совместимым со старыми ARM
        $B/armv7a-linux-androideabi21-clang -shared -fPIC -O2 -march=armv5te -o out/armeabi-v7a/libdriver.so jni/armeabi-v7a/c.c
    - uses: actions/upload-artifact@v4
      with:
        name: pbdroid-video-libs
        path: out/
