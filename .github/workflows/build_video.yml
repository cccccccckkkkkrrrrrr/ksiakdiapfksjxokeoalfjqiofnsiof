name: build-video-libs
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup NDK
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r16b-linux-x86_64.zip
        unzip -q android-ndk-r16b-linux-x86_64.zip
        echo "NDK=$PWD/android-ndk-r16b" >> $GITHUB_ENV
    - name: Build
      run: |
        B=$NDK/toolchains/arm-linux-androideabi-4.9/prebuilt/linux-x86_64/bin
        mkdir -p out/armeabi
        $B/arm-linux-androideabi-gcc -shared -fPIC -O2 -o out/armeabi/libdriver.so jni/armeabi/c.c --sysroot=$NDK/sysroot -I$NDK/sysroot/usr/include -I$NDK/sysroot/usr/include/arm-linux-androideabi
    - uses: actions/upload-artifact@v4
      with:
        name: pbdroid-video-libs
        path: out/
