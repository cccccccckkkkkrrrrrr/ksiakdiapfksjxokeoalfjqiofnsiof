plugins {
    id 'com.android.application'
}

android {
    namespace 'multi.decompiler.by.pbcat'
    compileSdk 34

    defaultConfig {
        applicationId "multi.decompiler.by.pbcat"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    
    
}

dependencies {
    implementation 'com.github.oscar0812:JDSXTool:1.0.0'
}

dependencies {
    // JADX для APK/DEX
    implementation 'io.github.skylot:jadx-core:1.5.6'
    implementation 'io.github.skylot:jadx-dex-input:1.5.6'
    
    // Smali to Java через JDSXTool
    implementation 'com.github.oscar0812:JDSXTool:1.0.0'
}
